name: Release extension

# Runs only when a v* tag is pushed. The tagged commit must be on main.
on:
  push:
    tags: ["v*"]

env:
  # Same Blender as the local install (blender-4.5.13-lts)
  BLENDER_VERSION: "4.5.13"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, to check the tag is on main

      - name: Check the tagged commit is on main
        run: |
          # Fetch main into an explicit ref, so the check never depends on how checkout set up the remote
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          tag_commit=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          main_commit=$(git rev-parse origin/main)
          echo "Tag ${GITHUB_REF_NAME}: ${tag_commit}"
          echo "main:     ${main_commit}"
          if ! git merge-base --is-ancestor "$tag_commit" "$main_commit"; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${tag_commit}) is not on main (${main_commit}). Push main before the tag, then re-run this workflow."
            exit 1
          fi

      - name: Build release notes
        run: |
          if ! bash .github/scripts/release_notes.sh "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" > notes.md; then
            echo "::error::changelog.md is missing or empty"
            exit 1
          fi
          cat notes.md

      - name: Install Blender runtime libraries
        # Libraries Blender needs in background (-b) mode. The runner image already ships them,
        # so this normally installs nothing and never touches apt. It can't block a release:
        # it's capped at 3 minutes and its failure is ignored (the Blender check below reports
        # any library that is really missing).
        timeout-minutes: 3
        continue-on-error: true
        run: |
          packages="libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libice6 libgl1"
          missing=""
          for p in $packages; do
            dpkg -s "$p" >/dev/null 2>&1 || missing="$missing $p"
          done
          if [ -z "$missing" ]; then
            echo "All libraries already installed"
            exit 0
          fi
          echo "Installing:$missing"
          sudo apt-get update -o Acquire::Retries=1
          sudo apt-get install -y --no-install-recommends $missing

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          series="${BLENDER_VERSION%.*}"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o blender.tar.xz \
            "https://download.blender.org/release/Blender${series}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          mkdir blender
          tar -xf blender.tar.xz -C blender --strip-components=1
          rm blender.tar.xz

      - name: Check Blender libraries
        run: |
          missing=$(ldd ./blender/blender | grep "not found" || true)
          if [ -n "$missing" ]; then
            echo "::error::Blender is missing system libraries:"
            echo "$missing"
            exit 1
          fi
          ./blender/blender --version | head -1

      - name: Validate manifest
        run: ./blender/blender --factory-startup --command extension validate proton_bus_3ds

      - name: Smoke test
        run: ./blender/blender -b --factory-startup --python-exit-code 1 --python tests/smoke_test.py

      - name: Build extension zip
        run: |
          rm -rf proton_bus_3ds/__pycache__
          mkdir -p dist
          ./blender/blender --factory-startup --command extension build \
            --source-dir proton_bus_3ds --output-dir dist
          mv dist/proton_bus_3ds-*.zip dist/proton-bus-simulator-blender.zip
          ls -l dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/proton-bus-simulator-blender.zip \
            --title "Proton Bus 3DS Tools ${GITHUB_REF_NAME}" \
            --notes-file notes.md
